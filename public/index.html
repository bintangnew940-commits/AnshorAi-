<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AnshorAi · Modern Art</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ── RESET & BASE ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-body: #0e0e12;
            --bg-card: rgba(22, 22, 30, 0.7);
            --accent: #b8a07c;
            --accent-light: #d4c4a8;
            --text-light: #f0ede8;
            --text-muted: #8a8580;
            --bubble-user: rgba(255, 255, 255, 0.04);
            --bubble-ai: rgba(255, 255, 255, 0.02);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            --radius: 28px;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-body);
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            position: relative;
            overflow: hidden;
        }

        /* ── Latar belakang abstrak (modern art) ── */
        .art-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .art-bg .circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(184, 160, 124, 0.04) 0%, transparent 70%);
            animation: floatArt 20s infinite alternate ease-in-out;
        }
        .art-bg .circle:nth-child(1) { width: 500px; height: 500px; top: -10%; left: -10%; }
        .art-bg .circle:nth-child(2) { width: 400px; height: 400px; bottom: -10%; right: -10%; animation-delay: 4s; }
        .art-bg .circle:nth-child(3) { width: 300px; height: 300px; top: 40%; left: 60%; animation-delay: 8s; }
        .art-bg .line {
            position: absolute;
            background: rgba(184, 160, 124, 0.02);
            transform-origin: center;
        }
        .art-bg .line:nth-child(4) { width: 800px; height: 1px; top: 20%; left: -20%; transform: rotate(25deg); }
        .art-bg .line:nth-child(5) { width: 600px; height: 1px; bottom: 30%; right: -10%; transform: rotate(-15deg); }

        @keyframes floatArt {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -20px) scale(1.05); }
        }

        /* ── Container utama ── */
        .app-container {
            width: 100%;
            height: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: none;
        }

        /* ── Header ── */
        .header {
            padding: 16px 20px 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(184, 160, 124, 0.05);
            background: rgba(14, 14, 18, 0.3);
        }

        .header-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #9a8a72);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #0e0e12;
            box-shadow: 0 0 30px rgba(184, 160, 124, 0.1);
            flex-shrink: 0;
        }

        .header-info {
            flex: 1;
            min-width: 0;
        }

        .header-info h1 {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-light);
            letter-spacing: 0.3px;
            line-height: 1.2;
        }

        .header-info h1 span {
            font-family: var(--font-body);
            font-weight: 300;
            font-size: 13px;
            color: var(--text-muted);
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #8cd4a0;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.7); }
        }

        .header-actions button {
            background: rgba(184, 160, 124, 0.04);
            border: none;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-actions button:hover {
            background: rgba(184, 160, 124, 0.08);
            color: var(--accent-light);
        }

        /* ── CHAT AREA (dengan background logo) ── */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 8px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
            position: relative;
            z-index: 2;
            -webkit-overflow-scrolling: touch;
        }

        .chat-area::-webkit-scrollbar { width: 3px; }
        .chat-area::-webkit-scrollbar-thumb { background: rgba(184, 160, 124, 0.15); border-radius: 20px; }

        /* ─── LOGO WATERMARK — SANGAT BESAR ─── */
        .chat-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.07;
            pointer-events: none;
            z-index: 0;
            user-select: none;
            text-align: center;
            width: 100%;
            max-width: 900px;
            padding: 0 20px;
        }
        .chat-watermark img {
            width: 100%;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            filter: grayscale(1) brightness(1.2);
            display: block;
            margin: 0 auto;
        }
        /* Fallback jika gambar gagal dimuat */
        .chat-watermark img::after {
            content: '✦';
            font-size: 120px;
            color: var(--accent);
            display: block;
        }

        /* ── Pesan ── */
        .message-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 100%;
            position: relative;
            z-index: 1;
        }

        .message-wrapper.user {
            flex-direction: row-reverse;
            align-self: flex-end;
        }

        .message-wrapper.ai {
            align-self: flex-start;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #0e0e12;
            background: var(--accent);
            box-shadow: 0 2px 12px rgba(184, 160, 124, 0.08);
            border: 1px solid rgba(184, 160, 124, 0.05);
        }

        .avatar.user-avatar {
            background: #5a5550;
            color: #f0ede8;
        }

        .message {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: 22px;
            font-size: 14px;
            line-height: 1.7;
            word-wrap: break-word;
            animation: rise 0.35s ease-out;
            position: relative;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(184, 160, 124, 0.04);
        }

        @keyframes rise {
            0% { opacity: 0; transform: translateY(10px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.user {
            background: var(--bubble-user);
            border-bottom-right-radius: 4px;
            color: var(--text-light);
        }

        .message.ai {
            background: var(--bubble-ai);
            border-bottom-left-radius: 4px;
            color: var(--text-light);
        }

        .message.ai .msg-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--accent-light);
            letter-spacing: 0.4px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-display);
        }

        .message .msg-time {
            font-size: 10px;
            color: var(--text-muted);
            opacity: 0.3;
            margin-top: 6px;
            text-align: right;
            letter-spacing: 0.2px;
        }

        /* ── Typing ── */
        .typing-indicator {
            align-self: flex-start;
            background: var(--bubble-ai);
            border-radius: 22px;
            border-bottom-left-radius: 4px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            border: 1px solid rgba(184, 160, 124, 0.04);
            z-index: 2;
            margin-left: 44px;
            backdrop-filter: blur(4px);
        }

        .typing-indicator.active {
            opacity: 1;
            pointer-events: auto;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: typing 1.4s infinite both;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.5); opacity: 0.2; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ── Empty state ── */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 16px;
            opacity: 0.5;
            z-index: 2;
            position: relative;
        }

        .empty-state .icon-big {
            font-size: 56px;
            color: var(--accent);
            opacity: 0.08;
            margin-bottom: 12px;
            font-family: var(--font-display);
        }

        .empty-state h3 {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 400;
            color: var(--accent-light);
            letter-spacing: 0.5px;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 13px;
            max-width: 240px;
            margin-top: 6px;
            line-height: 1.6;
            font-weight: 300;
        }

        /* ── Input ── */
        .input-area {
            padding: 8px 16px 14px;
            flex-shrink: 0;
            background: linear-gradient(0deg, rgba(14, 14, 18, 0.92), transparent);
            border-top: 1px solid rgba(184, 160, 124, 0.03);
            z-index: 2;
            position: relative;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            padding: 4px 4px 4px 16px;
            border: 1px solid rgba(184, 160, 124, 0.05);
            transition: 0.3s;
            backdrop-filter: blur(6px);
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(184, 160, 124, 0.02);
            background: rgba(255, 255, 255, 0.04);
        }

        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-light);
            font-size: 14px;
            font-family: var(--font-body);
            resize: none;
            padding: 10px 0;
            min-height: 38px;
            max-height: 110px;
            line-height: 1.5;
        }

        .input-wrapper textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.2;
            font-weight: 300;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            padding-bottom: 4px;
        }

        .input-actions button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-actions button:hover {
            color: var(--accent-light);
            background: rgba(184, 160, 124, 0.04);
        }

        .input-actions .btn-send {
            background: linear-gradient(135deg, var(--accent), #9a8a72);
            color: #0e0e12;
            font-size: 16px;
            box-shadow: 0 2px 16px rgba(184, 160, 124, 0.08);
            width: 44px;
            height: 44px;
        }

        .input-actions .btn-send:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 24px rgba(184, 160, 124, 0.15);
        }

        .input-actions .btn-send:active { transform: scale(0.93); }
        .input-actions .btn-send:disabled {
            opacity: 0.2;
            pointer-events: none;
            transform: scale(0.95);
        }

        /* ─── COPYRIGHT ─── */
        .copyright {
            padding: 8px 0 12px;
            font-size: 13px;
            font-weight: 400;
            color: rgba(184, 160, 124, 0.25);
            font-family: var(--font-display);
            letter-spacing: 0.5px;
            text-align: center;
            z-index: 2;
            position: relative;
            background: rgba(14, 14, 18, 0.4);
            backdrop-filter: blur(4px);
            border-top: 1px solid rgba(184, 160, 124, 0.03);
        }
        .copyright span {
            color: var(--accent-light);
            opacity: 0.5;
        }

        /* ── Responsif ── */
        @media (max-width: 480px) {
            .header { padding: 12px 14px 8px; gap: 10px; }
            .header-info h1 { font-size: 17px; }
            .header-icon { width: 36px; height: 36px; font-size: 16px; }
            .chat-area { padding: 10px 12px 6px; gap: 10px; }
            .message { font-size: 13px; padding: 12px 14px; max-width: 85%; }
            .avatar { width: 28px; height: 28px; font-size: 12px; }
            .input-area { padding: 6px 12px 10px; }
            .input-wrapper { padding-left: 12px; }
            .input-wrapper textarea { font-size: 13px; padding: 8px 0; min-height: 34px; }
            .input-actions .btn-send { width: 40px; height: 40px; font-size: 14px; }
            .typing-indicator { margin-left: 34px; padding: 8px 14px; }
            .empty-state h3 { font-size: 18px; }
            .empty-state .icon-big { font-size: 44px; }
            .copyright { font-size: 11px; padding: 6px 0 10px; }
            .chat-watermark { max-width: 600px; }
            .chat-watermark img { max-height: 70vh; }
        }
    </style>
</head>
<body>

    <!-- Latar modern art -->
    <div class="art-bg">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="line"></div>
        <div class="line"></div>
    </div>

    <div class="app-container">

        <!-- ─── HEADER ─── -->
        <header class="header">
            <div class="header-icon">
                <i class="fas fa-feather-alt"></i>
            </div>
            <div class="header-info">
                <h1>
                    AnshorAi
                    <span>· Modern Art</span>
                </h1>
                <div class="header-status">
                    <span class="status-dot"></span>
                    <span>Online</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="clearBtn" title="Bersihkan percakapan">
                    <i class="fas fa-undo-alt"></i>
                </button>
            </div>
        </header>

        <!-- ─── CHAT AREA ─── -->
        <div class="chat-area" id="chatArea">

            <!-- ─── LOGO WATERMARK — SANGAT BESAR ─── -->
            <div class="chat-watermark">
                <!-- Ganti 'logo.png' dengan nama file gambar Anda -->
                <img src="logo.png" alt="Logo" />
            </div>

            <!-- Empty state -->
            <div class="empty-state" id="emptyState">
                <div class="icon-big">✦</div>
                <h3>Ruang Kreatif</h3>
                <p>AnshorAi hadir untuk diskusi tentang ide, seni, dan pengetahuan.</p>
            </div>

            <!-- Typing indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>

        </div>

        <!-- ─── INPUT AREA ─── -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="messageInput" rows="1" placeholder="Tulis pesan…" aria-label="Ketik pesan"></textarea>
                <div class="input-actions">
                    <button id="sendBtn" class="btn-send" aria-label="Kirim">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ─── COPYRIGHT ─── -->
        <div class="copyright">
            <span>✦</span> copyright by bintangNPdev <span>✦</span>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ─── KONFIGURASI API ───
            const API_CONFIG = {
                url: 'http://localhost:3000/api/chat',   // GANTI dengan endpoint server Anda
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            };

            // ─── DOM ───
            const chatArea = document.getElementById('chatArea');
            const emptyState = document.getElementById('emptyState');
            const typingIndicator = document.getElementById('typingIndicator');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const clearBtn = document.getElementById('clearBtn');

            let isProcessing = false;

            // ─── HELPERS ───
            function getTime() {
                const now = new Date();
                return now.getHours().toString().padStart(2, '0') + ':' +
                       now.getMinutes().toString().padStart(2, '0');
            }

            function scrollToBottom() {
                setTimeout(() => {
                    chatArea.scrollTop = chatArea.scrollHeight;
                }, 50);
            }

            function toggleEmptyState() {
                const messages = chatArea.querySelectorAll('.message-wrapper');
                if (messages.length === 0) {
                    emptyState.style.display = 'flex';
                } else {
                    emptyState.style.display = 'none';
                }
            }

            // ─── RENDER PESAN ───
            function addMessage(text, sender) {
                const wrapper = document.createElement('div');
                wrapper.className = 'message-wrapper ' + sender;

                const avatar = document.createElement('div');
                avatar.className = 'avatar' + (sender === 'user' ? ' user-avatar' : '');
                avatar.textContent = sender === 'user' ? 'U' : 'A';

                const bubble = document.createElement('div');
                bubble.className = 'message ' + sender;

                if (sender === 'ai') {
                    const label = document.createElement('div');
                    label.className = 'msg-label';
                    label.innerHTML = '<i class="fas fa-feather-alt" style="font-size:10px;"></i> AnshorAi';
                    bubble.appendChild(label);
                }

                const textNode = document.createElement('div');
                textNode.textContent = text;
                bubble.appendChild(textNode);

                const time = document.createElement('div');
                time.className = 'msg-time';
                time.textContent = getTime();
                bubble.appendChild(time);

                wrapper.appendChild(avatar);
                wrapper.appendChild(bubble);

                // Sembunyikan empty state & typing
                typingIndicator.classList.remove('active');
                emptyState.style.display = 'none';

                chatArea.appendChild(wrapper);
                scrollToBottom();
                toggleEmptyState();
            }

            // ─── TAMPILKAN TYPING ───
            function showTyping() {
                typingIndicator.classList.add('active');
                scrollToBottom();
            }

            function hideTyping() {
                typingIndicator.classList.remove('active');
            }

            // ─── KIRIM PESAN ───
            async function sendMessage() {
                const text = messageInput.value.trim();
                if (!text || isProcessing) return;

                isProcessing = true;
                sendBtn.disabled = true;

                // Tampilkan pesan user
                addMessage(text, 'user');
                messageInput.value = '';
                messageInput.style.height = 'auto';

                // Tampilkan typing
                showTyping();

                try {
                    const response = await fetch(API_CONFIG.url, {
                        method: API_CONFIG.method,
                        headers: API_CONFIG.headers,
                        body: JSON.stringify({ message: text })
                    });

                    hideTyping();

                    if (!response.ok) {
                        throw new Error('Server error: ' + response.status);
                    }

                    const data = await response.json();
                    const reply = data.reply || data.message || data.response || 'Maaf, saya tidak bisa menjawab saat ini.';
                    addMessage(reply, 'ai');

                } catch (error) {
                    hideTyping();
                    console.error('API Error:', error);
                    addMessage('Terjadi kesalahan koneksi. Pastikan server berjalan.', 'ai');
                }

                isProcessing = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }

            // ─── CLEAR ───
            function clearChat() {
                const wrappers = chatArea.querySelectorAll('.message-wrapper');
                wrappers.forEach(el => el.remove());
                hideTyping();
                toggleEmptyState();
                chatArea.scrollTop = 0;
            }

            // ─── AUTO RESIZE TEXTAREA ───
            function autoResize() {
                messageInput.style.height = 'auto';
                messageInput.style.height = Math.min(messageInput.scrollHeight, 110) + 'px';
            }

            // ─── EVENT LISTENERS ───
            sendBtn.addEventListener('click', sendMessage);

            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            messageInput.addEventListener('input', autoResize);

            clearBtn.addEventListener('click', clearChat);

            // ─── INIT ───
            toggleEmptyState();
            messageInput.focus();

        })();
    </script>

</body>
</html>
