<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AnshorAi · Istana Ilmu</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:opsz,wght@14..32,300..700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --gold: #c9a84c;
            --gold-light: #e8d5a3;
            --gold-glow: rgba(201, 168, 76, 0.3);
            --navy: #0f1a2f;
            --navy-light: #1b2a45;
            --cream: #faf3e6;
            --text-dark: #1e1a16;
            --text-muted: #6b655a;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            --radius: 28px;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--navy);
            color: var(--cream);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            position: relative;
            overflow: hidden;
        }

        /* ── Latar belakang geometri Islami ── */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(201, 168, 76, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(201, 168, 76, 0.03) 0%, transparent 50%),
                repeating-conic-gradient(from 0deg at 50% 50%,
                    transparent 0deg, transparent 15deg,
                    rgba(201, 168, 76, 0.02) 15deg, rgba(201, 168, 76, 0.02) 16deg);
            background-size: 100% 100%, 100% 100%, 80px 80px;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Ornamen lengkungan (mihrab) ── */
        .mihrab {
            position: fixed;
            bottom: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            height: 60%;
            background: radial-gradient(ellipse at 50% 100%, rgba(201, 168, 76, 0.03) 0%, transparent 70%);
            border-radius: 50% 50% 0 0 / 80% 80% 0 0;
            z-index: 0;
            pointer-events: none;
            border-bottom: 2px solid rgba(201, 168, 76, 0.03);
        }

        /* ── Lampu gantung (dekorasi) ── */
        .chandelier {
            position: fixed;
            top: 2%;
            right: 4%;
            font-size: 52px;
            color: var(--gold);
            opacity: 0.10;
            z-index: 0;
            pointer-events: none;
            animation: sway 8s ease-in-out infinite alternate;
            transform-origin: top center;
        }
        .chandelier::before {
            content: '\f0e7';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
        }

        @keyframes sway {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }

        /* ── Kaligrafi latar ── */
        .calligraphy {
            position: fixed;
            font-family: 'Amiri', serif;
            font-size: 80px;
            color: var(--gold);
            opacity: 0.02;
            z-index: 0;
            pointer-events: none;
            user-select: none;
            line-height: 1;
        }
        .calligraphy.tl { top: 5%; left: 4%; font-size: 60px; }
        .calligraphy.br { bottom: 8%; right: 5%; font-size: 70px; transform: rotate(180deg); }

        /* ── Container utama (full screen) ── */
        .app-container {
            width: 100%;
            height: 100%;
            background: rgba(15, 26, 47, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: none;
        }

        /* ── Header elegan ── */
        .header {
            padding: 14px 20px 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(201, 168, 76, 0.08);
            background: rgba(15, 26, 47, 0.3);
            backdrop-filter: blur(4px);
        }

        .header-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), #a8873a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--navy);
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.15);
            flex-shrink: 0;
        }

        .header-info {
            flex: 1;
            min-width: 0;
        }

        .header-info h1 {
            font-family: 'Amiri', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--gold-light);
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .header-info h1 span {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 13px;
            color: rgba(250, 243, 230, 0.5);
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(250, 243, 230, 0.4);
            margin-top: 1px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #8cd4a0;
            display: inline-block;
            animation: pulse-dot 2s infinite;
            box-shadow: 0 0 12px rgba(140, 212, 160, 0.2);
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }

        .header-actions button {
            background: rgba(201, 168, 76, 0.04);
            border: none;
            color: rgba(250, 243, 230, 0.4);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .header-actions button:hover {
            background: rgba(201, 168, 76, 0.12);
            color: var(--gold);
        }

        /* ── Chat Area ── */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 6px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            position: relative;
            z-index: 2;
            -webkit-overflow-scrolling: touch;
        }

        .chat-area::-webkit-scrollbar { width: 3px; }
        .chat-area::-webkit-scrollbar-thumb { background: rgba(201, 168, 76, 0.15); border-radius: 20px; }

        /* ── Pesan ── */
        .message-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 100%;
        }

        .message-wrapper.user {
            flex-direction: row-reverse;
            align-self: flex-end;
        }

        .message-wrapper.ai {
            align-self: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: var(--navy);
            background: var(--gold);
            box-shadow: 0 2px 12px rgba(201, 168, 76, 0.15);
            border: 1px solid rgba(201, 168, 76, 0.1);
        }

        .avatar.user-avatar {
            background: #6b655a;
            color: #faf3e6;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 22px;
            font-size: 14px;
            line-height: 1.7;
            word-wrap: break-word;
            animation: rise 0.35s ease-out;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(201, 168, 76, 0.04);
        }

        @keyframes rise {
            0% { opacity: 0; transform: translateY(10px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.user {
            background: rgba(201, 168, 76, 0.10);
            border-bottom-right-radius: 4px;
            color: var(--cream);
            border-color: rgba(201, 168, 76, 0.06);
        }

        .message.ai {
            background: rgba(255, 255, 255, 0.04);
            border-bottom-left-radius: 4px;
            color: var(--cream);
            border-color: rgba(201, 168, 76, 0.03);
            backdrop-filter: blur(4px);
        }

        .message.ai .msg-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--gold-light);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Amiri', serif;
        }

        .message .msg-time {
            font-size: 10px;
            color: rgba(250, 243, 230, 0.3);
            margin-top: 6px;
            text-align: right;
            letter-spacing: 0.2px;
        }

        /* ── Typing ── */
        .typing-indicator {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 22px;
            border-bottom-left-radius: 4px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            border: 1px solid rgba(201, 168, 76, 0.04);
            z-index: 2;
            margin-left: 46px;
            backdrop-filter: blur(4px);
        }

        .typing-indicator.active {
            opacity: 1;
            pointer-events: auto;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
            animation: typing 1.4s infinite both;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.5); opacity: 0.2; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ── Empty state ── */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 16px;
            opacity: 0.6;
            z-index: 2;
            position: relative;
        }

        .empty-state .icon-big {
            font-size: 60px;
            color: var(--gold);
            opacity: 0.10;
            margin-bottom: 12px;
            font-family: 'Amiri', serif;
        }

        .empty-state h3 {
            font-family: 'Amiri', serif;
            font-size: 26px;
            font-weight: 400;
            color: var(--gold-light);
            letter-spacing: 0.5px;
        }

        .empty-state p {
            color: rgba(250, 243, 230, 0.4);
            font-size: 14px;
            max-width: 260px;
            margin-top: 6px;
            line-height: 1.7;
            font-weight: 300;
        }

        /* ── Input ── */
        .input-area {
            padding: 8px 16px 14px;
            flex-shrink: 0;
            background: linear-gradient(0deg, rgba(15, 26, 47, 0.92), transparent);
            border-top: 1px solid rgba(201, 168, 76, 0.04);
            z-index: 2;
            position: relative;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            padding: 4px 4px 4px 16px;
            border: 1px solid rgba(201, 168, 76, 0.06);
            transition: 0.3s;
            backdrop-filter: blur(6px);
        }

        .input-wrapper:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.03);
            background: rgba(255, 255, 255, 0.04);
        }

        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--cream);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            resize: none;
            padding: 10px 0;
            min-height: 38px;
            max-height: 110px;
            line-height: 1.5;
        }

        .input-wrapper textarea::placeholder {
            color: rgba(250, 243, 230, 0.2);
            font-weight: 300;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            padding-bottom: 4px;
        }

        .input-actions button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: rgba(250, 243, 230, 0.3);
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .input-actions button:hover {
            color: var(--gold);
            background: rgba(201, 168, 76, 0.04);
        }

        .input-actions .btn-send {
            background: linear-gradient(135deg, var(--gold), #a8873a);
            color: var(--navy);
            font-size: 16px;
            box-shadow: 0 2px 16px rgba(201, 168, 76, 0.15);
            width: 44px;
            height: 44px;
        }

        .input-actions .btn-send:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 24px rgba(201, 168, 76, 0.25);
        }

        .input-actions .btn-send:active { transform: scale(0.93); }
        .input-actions .btn-send:disabled {
            opacity: 0.2;
            pointer-events: none;
            transform: scale(0.95);
        }

        /* ─── COPYRIGHT (sangat jelas & kontras) ─── */
        .copyright {
            padding: 8px 0 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--gold-light);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            text-align: center;
            z-index: 2;
            position: relative;
            background: rgba(15, 26, 47, 0.6);
            backdrop-filter: blur(4px);
            border-top: 1px solid rgba(201, 168, 76, 0.06);
            text-shadow: 0 0 20px rgba(201, 168, 76, 0.1);
        }
        .copyright span {
            color: var(--gold);
            font-weight: 700;
            margin: 0 4px;
        }
        .copyright .divider {
            color: rgba(201, 168, 76, 0.2);
            margin: 0 8px;
        }

        /* ── Responsif ── */
        @media (max-width: 480px) {
            .header { padding: 10px 14px 8px; }
            .header-info h1 { font-size: 18px; }
            .header-icon { width: 36px; height: 36px; font-size: 16px; }
            .chat-area { padding: 8px 10px 4px; gap: 10px; }
            .message { font-size: 13px; padding: 12px 14px; max-width: 85%; }
            .avatar { width: 30px; height: 30px; font-size: 13px; }
            .input-area { padding: 6px 10px 10px; }
            .input-wrapper { padding-left: 12px; }
            .input-wrapper textarea { font-size: 13px; padding: 8px 0; min-height: 34px; }
            .input-actions .btn-send { width: 40px; height: 40px; font-size: 14px; }
            .typing-indicator { margin-left: 36px; padding: 8px 14px; }
            .empty-state h3 { font-size: 20px; }
            .empty-state .icon-big { font-size: 48px; }
            .copyright { font-size: 12px; padding: 6px 0 10px; }
            .calligraphy.tl { font-size: 40px; }
            .calligraphy.br { font-size: 50px; }
            .chandelier { font-size: 36px; }
        }

        @media (max-width: 360px) {
            .header-info h1 { font-size: 16px; }
            .message { font-size: 12px; padding: 10px 12px; max-width: 82%; }
            .avatar { width: 26px; height: 26px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <!-- Latar geometri -->
    <div class="bg-pattern"></div>

    <!-- Lengkungan mihrab -->
    <div class="mihrab"></div>

    <!-- Lampu gantung -->
    <div class="chandelier"></div>

    <!-- Kaligrafi latar -->
    <div class="calligraphy tl">﷽</div>
    <div class="calligraphy br">﷽</div>

    <!-- ─── CONTAINER UTAMA ─── -->
    <div class="app-container">

        <!-- ─── HEADER ─── -->
        <header class="header">
            <div class="header-icon">
                <i class="fas fa-feather-alt"></i>
            </div>
            <div class="header-info">
                <h1>
                    AnshorAi
                    <span>· Istana Ilmu</span>
                </h1>
                <div class="header-status">
                    <span class="status-dot"></span>
                    <span>Online</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="clearBtn" title="Bersihkan percakapan" aria-label="Clear chat">
                    <i class="fas fa-undo-alt"></i>
                </button>
            </div>
        </header>

        <!-- ─── CHAT AREA ─── -->
        <div class="chat-area" id="chatArea">

            <!-- Empty state -->
            <div class="empty-state" id="emptyState">
                <div class="icon-big">﷽</div>
                <h3>Majelis Ilmu</h3>
                <p>AnshorAi hadir untuk menemani diskusi Anda — tentang hikmah, pengetahuan, dan perenungan.</p>
            </div>

            <!-- Typing indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>

        </div>

        <!-- ─── INPUT AREA ─── -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="messageInput" rows="1" placeholder="Tuliskan pertanyaan atau renungan…" aria-label="Ketik pesan"></textarea>
                <div class="input-actions">
                    <button id="sendBtn" class="btn-send" aria-label="Kirim">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ─── COPYRIGHT (jelas & kontras) ─── -->
        <div class="copyright">
            <span>✦</span> copyright by bintangNPdev <span>✦</span>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ─── KONFIGURASI API ───
            const API_CONFIG = {
                url: 'http://localhost:3000/api/chat',   // GANTI dengan endpoint server Anda
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            };

            // ─── DOM ───
            const chatArea = document.getElementById('chatArea');
            const emptyState = document.getElementById('emptyState');
            const typingIndicator = document.getElementById('typingIndicator');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const clearBtn = document.getElementById('clearBtn');

            let isProcessing = false;
            let messageCount = 0;

            // ─── HELPERS ───
            function getTime() {
                const d = new Date();
                return String(d.getHours()).padStart(2, '0') + '.' + String(d.getMinutes()).padStart(2, '0');
            }

            function scrollToBottom() {
                requestAnimationFrame(() => chatArea.scrollTop = chatArea.scrollHeight);
            }

            function updateEmptyState() {
                const hasMessages = chatArea.querySelectorAll('.message-wrapper').length > 0;
                emptyState.style.display = hasMessages ? 'none' : 'flex';
            }

            function addMessage(text, sender, time) {
                emptyState.style.display = 'none';

                const wrapper = document.createElement('div');
                wrapper.className = `message-wrapper ${sender}`;

                // Avatar
                const avatar = document.createElement('div');
                avatar.className = `avatar ${sender === 'user' ? 'user-avatar' : ''}`;
                avatar.innerHTML = sender === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-feather-alt"></i>';

                // Bubble
                const bubble = document.createElement('div');
                bubble.className = `message ${sender}`;
                const label = sender === 'ai' ?
                    `<div class="msg-label"><i class="fas fa-feather-alt"></i> AnshorAi</div>` :
                    '';
                const timeStr = time || getTime();
                bubble.innerHTML = `
                    ${label}
                    <div class="msg-text">${text}</div>
                    <div class="msg-time">${timeStr}</div>
                `;

                wrapper.appendChild(avatar);
                wrapper.appendChild(bubble);
                chatArea.insertBefore(wrapper, typingIndicator);
                messageCount++;
                scrollToBottom();
                return wrapper;
            }

            // ─── KIRIM KE SERVER ───
            async function sendToServer(userMessage) {
                const response = await fetch(API_CONFIG.url, {
                    method: API_CONFIG.method,
                    headers: API_CONFIG.headers,
                    body: JSON.stringify({ message: userMessage })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server error (${response.status}): ${errorText}`);
                }

                const data = await response.json();
                if (data.reply === undefined) {
                    throw new Error('Respons server tidak memiliki field "reply"');
                }
                return data.reply;
            }

            // ─── PROSES KIRIM ───
            async function handleSend() {
                const text = messageInput.value.trim();
                if (!text || isProcessing) return;

                addMessage(text, 'user');
                messageInput.value = '';
                messageInput.style.height = 'auto';
                messageInput.focus();

                isProcessing = true;
                sendBtn.disabled = true;
                typingIndicator.classList.add('active');
                scrollToBottom();

                try {
                    const reply = await sendToServer(text);
                    typingIndicator.classList.remove('active');
                    addMessage(reply, 'ai');
                } catch (error) {
                    typingIndicator.classList.remove('active');
                    addMessage(`❌ Gagal menghubungi server: ${error.message}`, 'ai');
                    console.error('API Error:', error);
                } finally {
                    isProcessing = false;
                    sendBtn.disabled = false;
                    scrollToBottom();
                }
            }

            // ─── EVENT LISTENERS ───
            sendBtn.addEventListener('click', handleSend);

            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });

            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 110) + 'px';
            });

            clearBtn.addEventListener('click', () => {
                if (messageCount === 0) return;
                if (!confirm('Hapus semua pesan di layar?')) return;
                const msgs = chatArea.querySelectorAll('.message-wrapper');
                msgs.forEach(el => el.remove());
                messageCount = 0;
                updateEmptyState();
                typingIndicator.classList.remove('active');
                isProcessing = false;
                sendBtn.disabled = false;
                messageInput.value = '';
                messageInput.style.height = 'auto';
                messageInput.focus();
                scrollToBottom();
            });

            // ─── INIT ───
            updateEmptyState();
            messageInput.focus();

            // Mencegah zoom gesture
            document.addEventListener('gesturestart', (e) => e.preventDefault());
        })();
    </script>

</body>
</html>
